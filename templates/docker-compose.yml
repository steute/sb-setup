services:
  sensorbridge:
    image: steute/sensor-bridge:main
    container_name: sensorbridge
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      TZ: ${TZ:-Europe/Berlin}
      SB_MASTERKEY_FILE: /run/secrets/sb_masterkey
      POSTGRES_USERNAME: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-steute}
      POSTGRES_SSL: "true"
      POSTGRES_ROOT_CA_FILE: "/app/certs/sb-root-ca.pem"
      POSTGRES_REJECT_UNAUTHORIZED: "true"      
      INITIAL_USERNAME: ${SB_INITUSER:-admin}
      INITIAL_PASSWORD_FILE: /run/secrets/initial_sb_password
      MQTT_PROTOCOL: "mqtts"
      MQTT_HOST: "mosquitto"
      MQTT_PORT: 8883
      MQTT_REJECT_UNAUTHORIZED: "true"
      MQTT_ROOT_CA_FILE: "/app/certs/sb-root-ca.pem"
      MQTT_ROOT_TOPIC: "steute"
      MQTT_CLIENT_ID: ${SB_MQTTCLIENTID:-sensorbridge_client}
      MQTT_USERNAME: ${SB_MQTTUSER:-mqttclient}
      MQTT_PASSWORD_FILE: /run/secrets/mqtt_password
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sb-root.rule=PathPrefix(`/`)"
      - "traefik.http.routers.sb-root.entrypoints=websecure"
      - "traefik.http.routers.sb-root.tls=true"
      - "traefik.http.routers.sb-root.service=sensorbridge-svc"
      - "traefik.http.services.sensorbridge-svc.loadbalancer.server.port=3000"
    volumes:
      - ./ca/sb-root-ca.pem:/app/certs/sb-root-ca.pem:ro
    depends_on:
      - postgres
    secrets:
      - postgres_password
      - initial_sb_password
      - mqtt_password
      - sb_masterkey

  postgres:
    image: dhi.io/postgres:18.1-alpine3.22
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-steute}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - ./postgres/data:/var/lib/postgresql
      - ./postgres/postgres-internal.pem:/var/lib/postgresql/postgres-internal.pem:ro
      - ./postgres/postgres-internal-key.pem:/var/lib/postgresql/postgres-internal-key.pem:ro
      - ./postgres/pg_hba.conf:/var/lib/postgresql/pg_hba.conf:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    secrets:
      - postgres_password
    command: >
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/postgres-internal.pem
      -c ssl_key_file=/var/lib/postgresql/postgres-internal-key.pem
      -c hba_file=/var/lib/postgresql/pg_hba.conf

  mosquitto:
    image: dhi.io/eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mqtt-ws.rule=PathPrefix(`/mqttproxy`)"
      - "traefik.http.middlewares.mqtt-ws-stripprefix.stripprefix.prefixes=/mqttproxy"
      - "traefik.http.routers.mqtt-ws.middlewares=mqtt-ws-stripprefix"
      - "traefik.http.routers.mqtt-ws.entrypoints=websecure"
      - "traefik.http.routers.mqtt-ws.tls=true"
      - "traefik.http.routers.mqtt-ws.service=mqtt-ws-svc"
      - "traefik.http.services.mqtt-ws-svc.loadbalancer.server.port=9001"
    volumes:
      - ./mosquitto:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  docker-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - CONTAINERS=1
      - NETWORKS=1
      - INFO=1
    networks:
      - socket_proxy
    tmpfs:
      - /run
    security_opt:
      - no-new-privileges=true
    read_only: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  traefik:
    image: dhi.io/traefik:3.6
    container_name: traefik
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
    command:
      - "--log.level=INFO"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      # Use own TLS certificates
      - "--providers.file.filename=/etc/traefik/traefik-tls-config.yaml"
    ports:
      - "443:443"
    volumes:
      - ./traefik/traefik-tls-config.yaml:/etc/traefik/traefik-tls-config.yaml:ro
      - ./traefik/steute-sb-internal.pem:/etc/traefik/steute-sb-internal.pem:ro
      - ./traefik/steute-sb-internal-key.pem:/etc/traefik/steute-sb-internal-key.pem:ro
    depends_on:
      - docker-socket-proxy
    networks:
      - default
      - socket_proxy      

networks:
  default:
    driver: bridge
  socket_proxy:
    name: socket_proxy
    driver: bridge

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  initial_sb_password:
    file: ./secrets/initial_sb_password.txt
  mqtt_password:
    file: ./secrets/mqtt_password.txt
  sb_masterkey:
    file: ./secrets/sb_masterkey.txt

volumes:
  mosquitto_data:
  mosquitto_log:
