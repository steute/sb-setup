services:
  sensorbridge:
    # visit https://github.com/steute/sb-setup for latest image versions
    image: steute/sensor-bridge:3.0.0
    # running as node:node (1000:1000)
    container_name: sensorbridge
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # Initial user and password for first login to Sensor Bridge web interface
      INITIAL_USERNAME: ${SB_INITUSER:-admin}
      INITIAL_PASSWORD_FILE: /run/secrets/initial_sb_password
      # This masterkey is used to encrypt data in the database
      SB_MASTERKEY_FILE: /run/secrets/sb_masterkey
      # Database connection settings
      POSTGRES_USERNAME: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password_sb
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-steute}
      POSTGRES_SSL: "true"
      POSTGRES_ROOT_CA_FILE: "/app/certs/sb-root-ca.pem"
      POSTGRES_REJECT_UNAUTHORIZED: "true"
      # MQTT connection settings
      MQTT_PROTOCOL: "mqtts"
      MQTT_HOST: "mosquitto"
      MQTT_PORT: 8883
      MQTT_REJECT_UNAUTHORIZED: "true"
      MQTT_ROOT_CA_FILE: "/app/certs/sb-root-ca.pem"
      MQTT_ROOT_TOPIC: "steute"
      MQTT_CLIENT_ID: ${SB_MQTTCLIENTID:-sensorbridge_client}
      MQTT_USERNAME: ${SB_MQTTUSER:-mqttclient}
      MQTT_PASSWORD_FILE: /run/secrets/mqtt_password
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sb-root.rule=PathPrefix(`/`)"
      - "traefik.http.routers.sb-root.entrypoints=websecure"
      - "traefik.http.routers.sb-root.tls=true"
      - "traefik.http.routers.sb-root.service=sensorbridge-svc"
      - "traefik.http.services.sensorbridge-svc.loadbalancer.server.port=3000"
    volumes:
      - ./ca/sb-root-ca.pem:/app/certs/sb-root-ca.pem:ro
    depends_on:
      - postgres
    secrets:
      - postgres_password_sb
      - initial_sb_password
      - mqtt_password
      - sb_masterkey

  postgres:
    image: dhi.io/postgres:18.1-alpine3.22
    # running as postgres:postgres (70:70)
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-steute}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password_pg
    volumes:
      - ./postgres/data:/var/lib/postgresql
      - ./postgres/postgres-internal.pem:/var/lib/postgresql/postgres-internal.pem:ro
      - ./postgres/postgres-internal-key.pem:/var/lib/postgresql/postgres-internal-key.pem:ro
      - ./postgres/pg_hba.conf:/var/lib/postgresql/pg_hba.conf:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    secrets:
      - postgres_password_pg
    command: >
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/postgres-internal.pem
      -c ssl_key_file=/var/lib/postgresql/postgres-internal-key.pem
      -c hba_file=/var/lib/postgresql/pg_hba.conf

  mosquitto:
    image: dhi.io/eclipse-mosquitto:2.0
    # DHI image running as nonroot:nonroot (65532:65532)
    # official image runs as mosquitto:mosquitto (1883:1883)
    container_name: mosquitto
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mqtt-ws.rule=PathPrefix(`/mqttproxy`)"
      - "traefik.http.middlewares.mqtt-ws-stripprefix.stripprefix.prefixes=/mqttproxy"
      - "traefik.http.routers.mqtt-ws.middlewares=mqtt-ws-stripprefix"
      - "traefik.http.routers.mqtt-ws.entrypoints=websecure"
      - "traefik.http.routers.mqtt-ws.tls=true"
      - "traefik.http.routers.mqtt-ws.service=mqtt-ws-svc"
      - "traefik.http.services.mqtt-ws-svc.loadbalancer.server.port=9001"
    volumes:
      - ./mosquitto:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  docker-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    # Running as root (0:0) to access docker socket, but with no-new-privileges
    # and read-only filesystem for security hardening
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - CONTAINERS=1
      - NETWORKS=1
      - INFO=1
    networks:
      - socket_proxy
    tmpfs:
      - /run
    security_opt:
      - no-new-privileges=true
    read_only: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  traefik:
    image: dhi.io/traefik:3.6
    # DHI version of Traefik runs as nonroot:nonroot (65532:65532)
    # Standard Traefik image runs as root (see https://github.com/traefik/traefik/issues/11750)
    container_name: traefik
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
    command:
      - "--log.level=INFO"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      # Use own TLS certificates
      - "--providers.file.filename=/etc/traefik/traefik-tls-config.yaml"
    ports:
      - "443:443"
    volumes:
      - ./traefik/traefik-tls-config.yaml:/etc/traefik/traefik-tls-config.yaml:ro
      - ./traefik/traefik-external.pem:/etc/traefik/traefik-external.pem:ro
      - ./traefik/traefik-external-key.pem:/etc/traefik/traefik-external-key.pem:ro
    depends_on:
      - docker-socket-proxy
    networks:
      - default
      - socket_proxy

  node-red:
    image: nodered/node-red:4.1.8-22
    container_name: node-red
    # runs as user node-red (uid 1000) and group node-red (gid 1000)
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - LANG=${LANG:-de_DE.UTF-8}
      # Sensor Bridge REST API configuration
      - SB_REST_API_PASSWORD_FILE=/run/secrets/sb-rest-api-password
      - SB_REST_API_USER=${SB_REST_API_USER:-nodered}
      - SB_REST_API_HOST=http://sensorbridge:3000
      # Node-RED configuration
      - NODE_RED_LOGLEVEL=info
      - NODE_RED_ENABLE_EDITOR=true
      - NODE_RED_ENABLE_ADMIN_USER=true
      - NODE_RED_ADMIN_PASSWORD_FILE=/run/secrets/node-red-admin-password
      - NODE_RED_ADMIN_USERNAME=${NODE_RED_ADMIN_USERNAME:-admin}
      - NODE_RED_ROOT_PATH=/nodered
    labels:
      # Traefik configuration to expose Node-RED at https://localhost/nodered/admin/
      # does not work yet, has to be investigated...
      - "traefik.enable=true"
      - "traefik.http.routers.node-red.rule=PathPrefix(`/nodered`)"
      - "traefik.http.routers.node-red.entrypoints=websecure"
      - "traefik.http.routers.node-red.tls=true"
      - "traefik.http.routers.node-red.service=node-red-svc"
      - "traefik.http.routers.node-red.priority=20"
      - "traefik.http.services.node-red-svc.loadbalancer.server.port=1880"
    secrets:
      - sb-rest-api-password
      - node-red-admin-password
    volumes:
      # for WSL: sudo chown 1000:1000 node-red/data/
      - ./node-red/data:/data
      - ./node-red/settings.js:/usr/src/node-red/custom-settings.js:ro
    command: >
      node-red
      --userDir /data
      --settings /usr/src/node-red/custom-settings.js

networks:
  default:
    driver: bridge
  socket_proxy:
    name: socket_proxy
    driver: bridge

secrets:
  postgres_password_pg:
    file: ./secrets/postgres_password_pg.txt
  postgres_password_sb:
    file: ./secrets/postgres_password_sb.txt
  initial_sb_password:
    file: ./secrets/initial_sb_password.txt
  mqtt_password:
    file: ./secrets/mqtt_password.txt
  sb_masterkey:
    file: ./secrets/sb_masterkey.txt
  node-red-admin-password:
    file: ./secrets/node-red-admin-password.txt
  sb-rest-api-password:
    file: ./secrets/sb-rest-api-password.txt

volumes:
  mosquitto_data:
  mosquitto_log:
